[workspace]
members = ["crates/kage-models"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
pedantic = { level = "warn", priority = -1 }
wildcard_imports = "allow"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.dependencies]
# The curated catalog is generated against kage's own catalog schema,
# so the two can never disagree about which providers exist or how a
# models.dev document is read. Pinned to a revision rather than a
# branch: a moving branch would silently change what this repo emits.
kage-core = { git = "https://github.com/QaidVoid/kage", rev = "415a84da7bc163029c464d785f54732247ee6d15" }
kage-provider = { git = "https://github.com/QaidVoid/kage", rev = "415a84da7bc163029c464d785f54732247ee6d15" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = "3"